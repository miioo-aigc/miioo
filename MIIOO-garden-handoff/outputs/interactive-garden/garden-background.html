<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>MIIOO · 交互花园背景</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    #garden-stage{position:fixed;inset:0;pointer-events:none}
    #garden-poster,#garden-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    #garden-poster{object-fit:contain;object-position:center bottom}
    #garden-canvas{opacity:0}#garden-poster.rendered{visibility:hidden}#garden-canvas.ready{opacity:1}
    .garden-controls{position:fixed;right:20px;bottom:20px;display:flex;gap:8px;z-index:2}
    .garden-controls button{display:flex;align-items:center;gap:7px;min-height:38px;padding:9px 14px;border:1px solid #ffffff28;border-radius:40px;background:#080d09b8;backdrop-filter:blur(8px);color:#d9e3d3;font:12px/1.4 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;cursor:pointer;touch-action:manipulation}
    .garden-controls button:hover{background:#1c281be6;border-color:#d9e3d378}.garden-controls button:focus-visible{outline:2px solid #d3e5c7;outline-offset:4px}.garden-controls button:disabled{opacity:.5;cursor:default}
    .garden-controls svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
    .garden-hint{position:fixed;bottom:27px;left:24px;color:#adbea3;font:11px/1.5 -apple-system,'PingFang SC',sans-serif;pointer-events:none}
    @media(max-width:700px){.garden-hint{display:none}.garden-controls{right:14px;bottom:16px}.garden-controls button{padding:9px 12px}}
    @media(max-width:700px){#garden-poster{top:auto;height:88%;object-fit:cover;object-position:25% bottom}}
    @media(prefers-reduced-motion:reduce){#garden-canvas{transition:none}}
  </style>
</head>
<body>
  <main id="garden-stage" aria-label="MIIOO 夜间花园，鼠标扫过花草时带起阵风">
    <img id="garden-poster" src="assets/neuralyn-garden.webp" alt="黑色夜幕中的白色蒲公英、金黄野花与苔藓">
    <canvas id="garden-canvas" aria-hidden="true"></canvas>
  </main>
  <span class="garden-hint">轻移鼠标，让花与叶随风起舞</span>
  <div class="garden-controls" aria-label="花园动画控制">
    <button id="motion-toggle" type="button" aria-pressed="false" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path id="motion-icon" d="M7 4v12M13 4v12"/></svg><span>暂停动画</span></button>
    <button id="wind-button" type="button" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 7h11a2.5 2.5 0 1 0-2.5-2.5M2 11h14a2.5 2.5 0 1 1-2.5 2.5M2 15h5"/></svg>吹一阵风</button>
  </div>
  <script type="module" src="background-controls.js"></script>
  <script type="module" src="neural-garden.js?v=20261029-continuous-r3"></script>
</body>
</html>
