server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name miioo.com miiooai.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/miioo.com/dist;
    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/miioo.com.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/miioo.com/*.conf;
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/miioo.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/miioo.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    include enable-php-82.conf;
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/miioo.com.conf;
    #REWRITE-END
    
    # ─────────────────────────────────────────────────────────────────
    # /api/ — 反代到 FastAPI（与 www 站点同一个 uvicorn :8000）
    # ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
    }

    # ─────────────────────────────────────────────────────────────────
    # SSE stream endpoints: disable buffering/cache for incremental chunks
    # ─────────────────────────────────────────────────────────────────
    location ~ ^/api/(llm/chat/stream|projects/[^/]+/episodes/[^/]+/generate/stream|projects/[^/]+/script-workspace/chat/stream)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_connect_timeout 600s;
        proxy_read_timeout    1800s;
        proxy_send_timeout    1800s;
    }

    # ─────────────────────────────────────────────────────────────────
    # /uploads/ — 用户上传的静态媒体文件（图片、视频、音频）
    #
    # 与 www 站点共用同一份 backend/uploads 目录，alias 末尾斜杠不能省。
    # ─────────────────────────────────────────────────────────────────
    location ^~ /uploads/ {
        alias /www/wwwroot/miiooaib.com/backend/uploads/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
        access_log off;
        autoindex off;
        # 禁止上传目录执行脚本
        location ~* \.(php|jsp|py|sh|lua|pl)$ {
            return 403;
        }
    }

    # ─────────────────────────────────────────────────────────────────
    # /media/ — 媒体路径回退到主站
    #
    # 前端网站不直接提供对象存储回源，统一 302 到 www.miiooai.com。
    # ─────────────────────────────────────────────────────────────────
    location ^~ /media/ {
        return 302 https://www.miiooai.com$request_uri;
    }

    # ─────────────────────────────────────────────────────────────────
    # 根路径 + SPA 历史路由回退
    #
    # try_files 命中 index.html 后由前端承接路由。
    # ─────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$ {
        return 404;
    }
    
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }
    
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/miioo.com.log;
    error_log  /www/wwwlogs/miioo.com.error.log;
}
