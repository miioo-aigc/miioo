# Include inside the frontend site's server block, before deployment.
location ^~ /__image-media/media/origin/ {
    limit_except GET HEAD { deny all; }
    proxy_pass https://www.chengxvblog.top/media/origin/;
    proxy_set_header Host www.chengxvblog.top;
    proxy_ssl_server_name on;
    proxy_ssl_name www.chengxvblog.top;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 300s;
}
